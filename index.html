<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Cost Pro</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f0f4f7;color:#172b3a}body.dark{background:#101827;color:#e5edf5}header{background:#142c3b;color:white;padding:22px}header b{font-size:25px;color:#64e2c2}nav{display:flex;gap:6px;overflow:auto;padding:12px;background:#142c3b;position:sticky;top:0;z-index:2}button{cursor:pointer;border:0;border-radius:8px;padding:11px 15px;font:inherit;background:#087d70;color:white}nav button{white-space:nowrap;background:#294757}nav button.active{background:#087d70}main{max-width:1100px;margin:auto;padding:16px}section,.card{background:white;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}.dark section,.dark .card{background:#1c2b3d}h2,h3{margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}label{display:block;font-size:13px}input,select,textarea{display:block;width:100%;padding:10px;border:1px solid #a4b4bd;border-radius:7px;font:inherit;background:transparent;color:inherit;margin-top:5px}option{color:#172b3a;background:white}.muted{opacity:.75}.big{font-size:27px;font-weight:bold;color:#087d70}.dark .big{color:#64e2c2}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #9aaab655;white-space:nowrap}button.secondary{background:#536778}button.danger{background:#a63b43}button.small{padding:6px 9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.bar{height:12px;background:#0a9c89;border-radius:8px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}#notice{position:fixed;bottom:12px;right:12px;background:#142c3b;color:white;padding:12px;border-radius:8px;display:none;z-index:5} @media print{header,nav,.actions,button,#notice{display:none!important}body{background:white;color:black}section{box-shadow:none}}
</style><header><b>3D Cost Pro</b><div>Gestão e precificação de impressão 3D · V3.1 · backup local e Google Drive</div></header><nav id="nav"></nav><main id="main"><section><h2>3D Cost Pro</h2><p>Se esta mensagem permanecer, abra o arquivo em um navegador com JavaScript habilitado. A prévia do aplicativo Arquivos ou do mensageiro pode não executar HTML interativo.</p></section></main><div id="notice"></div><script>
'use strict';const $=id=>document.getElementById(id), money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2), today=()=>new Date().toISOString().slice(0,10);const defaults=()=>({printers:[{id:'a1',name:'Bambu Lab A1 Mini',price:2000,life:5000,watts:100,maint:0.5},{id:'ac',name:'Anycubic Kobra 4 Combo',price:3500,life:5000,watts:150,maint:0.7}],filaments:[{id:'pla',name:'PLA exemplo',color:'Branco',price:90,stock:1000}],products:[],quotes:[],sales:[],expenses:[],settings:{energy:1,labor:25,overhead:0,margin:30,tax:0,fail:5,dark:false}});let db;try{db=JSON.parse(localStorage.getItem('3dcost-v2'))||defaults()}catch(e){db=defaults()}let page='Dashboard',edit=null,lines=[],last=null;function save(){try{localStorage.setItem('3dcost-v2',JSON.stringify(db));cloud.dirty=true;cloudSave();return true}catch(e){alert('Não foi possível salvar no navegador. Exporte um backup.');return false}}function notify(s){$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2500)}const pages=['Dashboard','Calculadora','Impressoras','Filamentos','Produtos','Orçamentos','Vendas','Despesas','Configurações'];function go(p){page=p;edit=null;render()}function field(id,label,val='',type='number',extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(val)}" ${type==='number'?'min="0" step="any"':''} ${extra}></label>`}function n(id){let v=$(id).value;if(v===''||!Number.isFinite(+v)||+v<0)throw Error('Confira os campos numéricos.');return +v}function str(id){let v=$(id).value.trim();if(!v)throw Error('Preencha os campos de texto.');return v}function run(fn){try{fn()}catch(e){alert(e.message)}}function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||'<tr><td>Nenhum registro.</td></tr>'}</tbody></table></div>`}const tr=(...cells)=>'<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>';function remove(k,id){if(confirm('Excluir registro?')){db[k]=db[k].filter(x=>x.id!==id);save();render()}}function actions(k,id){return `<button class="small secondary" onclick="editRecord('${k}','${id}')">Editar</button> <button class="small danger" onclick="remove('${k}','${id}')">Excluir</button>`}function editRecord(k,id){edit=db[k].find(x=>x.id===id);render()}function upsert(k,obj){if(edit){obj.id=edit.id;db[k]=db[k].map(x=>x.id===obj.id?obj:x)}else{obj.id=uid();db[k].push(obj)}edit=null;save();render();notify('Registro salvo')}function render(){document.body.classList.toggle('dark',db.settings.dark);$('nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('');const f={Dashboard:dashboard,Calculadora:calcPage,Impressoras:printers,Filamentos:filaments,Produtos:products,Orçamentos:quotes,Vendas:sales,Despesas:expenses,Configurações:settings};$('main').innerHTML=f[page]();if(page==='Configurações')$('main').insertAdjacentHTML('beforeend',cloudPanel());if(page==='Calculadora'){drawLines();calculate(false)}}function dashboard(){let rev=db.sales.reduce((a,x)=>a+x.total,0),cost=db.sales.reduce((a,x)=>a+x.cost+x.fees,0),exp=db.expenses.reduce((a,x)=>a+x.value,0);return `<h2>Visão geral · todos os períodos</h2><div class="grid">${[['Faturamento',rev],['Custos e taxas',cost],['Despesas extras',exp],['Resultado estimado',rev-cost-exp]].map(([k,v])=>`<div class="card">${k}<div class="big">${money(v)}</div></div>`).join('')}</div><section><h3>Resumo financeiro</h3>${[['Receitas',rev],['Custos',cost],['Despesas',exp]].map(([k,v])=>`<p>${k} · ${money(v)}</p><div class="bar" style="width:${100*v/Math.max(1,rev,cost,exp)}%"></div>`).join('')}</section><section><h3>Estoque</h3>${table(['Filamento','Saldo','Valor estimado'],db.filaments.map(x=>tr(esc(x.name),x.stock.toFixed(1)+' g',money(x.stock*x.price/1000))))}<p class="muted">Valores iniciais das impressoras e filamentos são exemplos. Ajuste antes de usar.</p><button onclick="go('Calculadora')">Nova precificação</button></section>`}function printers(){let x=edit||{};return `<section><h2>Impressoras</h2><div class="grid">${field('name','Nome',x.name,'text')}${field('price','Aquisição (R$)',x.price??0)}${field('life','Vida útil (horas)',x.life??5000)}${field('watts','Potência média (W)',x.watts??100)}${field('maint','Manutenção (R$/h)',x.maint??0)}</div><div class="actions"><button onclick="run(savePrinter)">Salvar impressora</button><button class="secondary" onclick="go(page)">Cancelar</button></div></section><section>${table(['Nome','Depreciação/h','Potência','Ações'],db.printers.map(x=>tr(esc(x.name),money(x.price/x.life),x.watts+' W',actions('printers',x.id))))}</section>`}function savePrinter(){let life=n('life');if(!life)throw Error('Vida útil deve ser maior que zero.');upsert('printers',{name:str('name'),price:n('price'),life,watts:n('watts'),maint:n('maint')})}function filaments(){let x=edit||{};return `<section><h2>Filamentos e estoque</h2><div class="grid">${field('name','Material / marca',x.name,'text')}${field('color','Cor',x.color,'text')}${field('price','Preço por kg (R$)',x.price??0)}${field('stock','Estoque atual (g)',x.stock??1000)}</div><div class="actions"><button onclick="run(()=>upsert('filaments',{name:str('name'),color:str('color'),price:n('price'),stock:n('stock')}))">Salvar</button><button class="secondary" onclick="go(page)">Cancelar</button></div></section><section>${table(['Material','Cor','R$/kg','Estoque','Ações'],db.filaments.map(x=>tr(esc(x.name),esc(x.color),money(x.price),x.stock.toFixed(1)+' g',actions('filaments',x.id))))}</section>`}function opts(arr){return arr.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} ${esc(x.color||'')}</option>`).join('')}function calcPage(){let s=db.settings;lines=[{id:db.filaments[0]?.id||'',part:20,support:0,purge:0}];return `<section><h2>Nova precificação</h2><div class="grid">${field('job','Nome do produto','Peça 3D','text')}<label>Impressora<select id="printer">${opts(db.printers)}</select></label>${field('qty','Peças boas por lote',1)}${field('hours','Horas de impressão',1)}${field('mins','Minutos adicionais',0)}${field('laborMin','Mão de obra (min/lote)',10)}${field('pack','Embalagem por peça (R$)',1)}${field('extra','Outros custos por lote (R$)',0)}</div></section><section><h3>Materiais por lote</h3><div id="lines"></div><button onclick="readLines();lines.push({id:db.filaments[0]?.id||'',part:0,support:0,purge:0});drawLines()">+ Filamento / cor</button></section><section><h3>Parâmetros de venda</h3><div class="grid">${field('energy','Energia (R$/kWh)',s.energy)}${field('labor','Mão de obra (R$/h)',s.labor)}${field('overhead','Custos fixos (R$/h)',s.overhead)}${field('fail','Taxa de falha (%)',s.fail)}${field('margin','Margem desejada (%)',s.margin)}${field('tax','Imposto (%)',s.tax)}${field('ml','Mercado Livre (%)',16)}${field('mlfix','ML fixo por peça (R$)',0)}${field('sh','Shopee (%)',20)}${field('shfix','Shopee fixo por peça (R$)',0)}${field('direct','Venda direta (%)',0)}</div><p class="muted">Taxas de marketplace são exemplos editáveis, não tarifas oficiais.</p><button onclick="calculate(true)">Calcular</button></section><section id="result"></section>`}function drawLines(){$('lines').innerHTML=lines.map((x,i)=>`<div class="grid" style="margin-bottom:12px"><label>Filamento ${i+1}<select id="f${i}">${opts(db.filaments)}</select></label>${field('p'+i,'Peça (g)',x.part)}${field('s'+i,'Suporte (g)',x.support)}${field('u'+i,'Purga (g)',x.purge)}<button class="danger small" onclick="readLines();lines.splice(${i},1);drawLines()">Remover</button></div>`).join('');lines.forEach((x,i)=>{$('f'+i).value=x.id})}function readLines(){lines=lines.map((x,i)=>({id:$('f'+i).value,part:+$('p'+i).value,support:+$('s'+i).value,purge:+$('u'+i).value}))}function calculate(show){try{readLines();let p=db.printers.find(x=>x.id===$('printer').value);if(!p||!lines.length)throw Error('Cadastre impressora e filamento.');let q=n('qty'),h=n('hours')+n('mins')/60,fail=n('fail')/100,margin=n('margin')/100,tax=n('tax')/100;if(!Number.isInteger(q)||q<1||fail>=1)throw Error('Quantidade inteira positiva e falha abaixo de 100%.');let mat=0,usage={};for(let x of lines){let f=db.filaments.find(y=>y.id===x.id),g=x.part+x.support+x.purge;if(!f||[x.part,x.support,x.purge].some(v=>!Number.isFinite(v)||v<0))throw Error('Confira os materiais.');mat+=g*f.price/1000;usage[f.id]=(usage[f.id]||0)+g}let energy=p.watts/1000*h*n('energy'),dep=p.price/p.life*h,maint=p.maint*h,over=h*n('overhead'),labor=n('laborMin')/60*n('labor'),extra=n('extra'),base=mat+energy+dep+maint+over+labor+extra,risk=base/(1-fail)-base,cost=(base+risk)/q+n('pack');let channels=[['Direta',n('direct'),0],['Mercado Livre',n('ml'),n('mlfix')],['Shopee',n('sh'),n('shfix')]].map(([name,rate,fixed])=>{let den=1-margin-tax-rate/100;if(den<=0)throw Error('Margem + taxas + impostos devem somar menos de 100%.');let price=Math.ceil((cost+fixed)/den*100)/100;return {name,price,fee:price*(tax+rate/100)+fixed,profit:price*(1-tax-rate/100)-fixed-cost}});last={name:str('job'),cost,qty:q,hours:h,usage,channels};$('result').innerHTML=`<h2>Resultado por peça</h2><div class="big">${money(cost)}</div><p>Custo total estimado do lote: ${money(cost*q)}</p>${table(['Componente por lote','Custo'],[['Material',mat],['Energia',energy],['Depreciação',dep],['Manutenção',maint],['Custos fixos',over],['Mão de obra',labor],['Outros',extra],['Reserva de falhas',risk],['Embalagem',n('pack')*q]].map(([k,v])=>tr(k,money(v))))}${table(['Canal','Preço sugerido','Taxas/imposto','Lucro'],channels.map(x=>tr(x.name,money(x.price),money(x.fee),money(x.profit))))}<div class="actions"><button onclick="run(()=>storeCalc('products'))">Salvar produto</button><button onclick="run(()=>storeCalc('quotes'))">Salvar orçamento</button><button onclick="run(recordProduction)">Registrar produção / baixar estoque</button></div>`}catch(e){last=null;$('result').textContent=e.message;if(show)alert(e.message)}}function storeCalc(k){calculate(true);if(!last)return;let channel=last.channels[0];db[k].push({id:uid(),...last,price:channel.price,date:today(),customer:''});save();notify('Salvo com preço de venda direta')}function recordProduction(){calculate(true);if(!last)return;for(let [id,g] of Object.entries(last.usage)){if(db.filaments.find(x=>x.id===id).stock<g)throw Error('Estoque insuficiente.')}if(!confirm('Descontar o material real informado para um lote?'))return;for(let [id,g] of Object.entries(last.usage))db.filaments.find(x=>x.id===id).stock-=g;save();notify('Estoque atualizado')}
function products(){let x=edit;return `<section><h2>Catálogo de produtos</h2>${x?`<div class="grid">${field('name','Nome',x.name,'text')}${field('cost','Custo unitário',x.cost)}${field('price','Preço unitário',x.price)}</div><button onclick="run(()=>upsert('products',{...edit,name:str('name'),cost:n('cost'),price:n('price')}))">Salvar</button>`:'<button onclick="go(\'Calculadora\')">Criar produto pela calculadora</button>'}${table(['Produto','Custo','Preço','Ações'],db.products.map(x=>tr(esc(x.name),money(x.cost),money(x.price),actions('products',x.id))))}</section>`}function quotes(){let x=edit;return `<section><h2>Orçamentos</h2>${x?`<div class="grid">${field('customer','Cliente',x.customer,'text')}${field('name','Produto',x.name,'text')}${field('qty','Quantidade',x.qty)}${field('price','Preço unitário',x.price)}</div><button onclick="run(()=>upsert('quotes',{...edit,customer:str('customer'),name:str('name'),qty:n('qty'),price:n('price')}))">Salvar</button>`:'<button onclick="go(\'Calculadora\')">Novo orçamento</button>'}${table(['Data','Cliente','Produto','Total','Ações'],db.quotes.map(x=>tr(esc(x.date),esc(x.customer||'—'),esc(x.name),money(x.qty*x.price),actions('quotes',x.id)+` <button class="small" onclick="printQuote('${x.id}')">PDF</button>`)))}</section>`}function printQuote(id){let x=db.quotes.find(y=>y.id===id);$('main').innerHTML=`<section><h2>3D Cost Pro — Orçamento</h2><p>Data: ${esc(x.date)}</p><p>Cliente: ${esc(x.customer||'—')}</p>${table(['Produto','Quantidade','Unitário','Total'],[tr(esc(x.name),x.qty,money(x.price),money(x.qty*x.price))])}<div class="actions"><button onclick="window.print()">Imprimir / salvar PDF</button><button onclick="render()">Voltar</button></div></section>`}function sales(){let x=edit||{};return `<section><h2>Registrar venda</h2><label>Preencher pelo catálogo<select onchange="fillSale(this.value)"><option value="">Selecione (opcional)</option>${opts(db.products)}</select></label><div class="grid">${field('name','Produto',x.name,'text')}${field('date','Data',x.date||today(),'date')}${field('qty','Quantidade',x.qty??1)}${field('price','Preço unitário',x.price??0)}${field('cost','Custo unitário',x.unitCost??0)}${field('fees','Taxas e impostos totais',x.fees??0)}</div><div class="actions"><button onclick="run(saveSale)">Salvar venda</button><button class="secondary" onclick="go(page)">Cancelar</button></div><p class="muted">A venda não desconta estoque novamente. Registre a produção na calculadora.</p></section><section>${table(['Data','Produto','Receita','Lucro estimado','Ações'],db.sales.map(x=>tr(esc(x.date),esc(x.name),money(x.total),money(x.total-x.cost-x.fees),actions('sales',x.id))))}</section>`}function fillSale(id){let x=db.products.find(y=>y.id===id);if(x){$('name').value=x.name;$('price').value=x.price;$('cost').value=x.cost}}function saveSale(){let qty=n('qty'),price=n('price'),unitCost=n('cost');if(!Number.isInteger(qty)||qty<1)throw Error('Quantidade inválida.');upsert('sales',{name:str('name'),date:str('date'),qty,price,unitCost,total:qty*price,cost:qty*unitCost,fees:n('fees')})}function expenses(){let x=edit||{};return `<section><h2>Despesas adicionais</h2><div class="grid">${field('name','Descrição',x.name,'text')}${field('date','Data',x.date||today(),'date')}${field('value','Valor (R$)',x.value??0)}</div><div class="actions"><button onclick="run(()=>upsert('expenses',{name:str('name'),date:str('date'),value:n('value')}))">Salvar</button><button class="secondary" onclick="go(page)">Cancelar</button></div><p class="muted">Não repita despesas já incluídas nos custos das peças.</p></section><section>${table(['Data','Descrição','Valor','Ações'],db.expenses.map(x=>tr(esc(x.date),esc(x.name),money(x.value),actions('expenses',x.id))))}</section>`}function settings(){let s=db.settings;return `<section><h2>Configurações padrão</h2><div class="grid">${field('energy','Energia (R$/kWh)',s.energy)}${field('labor','Mão de obra (R$/h)',s.labor)}${field('overhead','Custos fixos (R$/h)',s.overhead)}${field('margin','Margem (%)',s.margin)}${field('tax','Imposto (%)',s.tax)}${field('fail','Falhas (%)',s.fail)}</div><div class="actions"><button onclick="run(saveSettings)">Salvar padrões</button><button class="secondary" onclick="db.settings.dark=!db.settings.dark;save();render()">Alternar tema</button></div></section><section><h2>Backup e transferência</h2><p>Os dados ficam neste navegador. Exporte regularmente. Para transferir para outro dispositivo, importe o arquivo JSON nele.</p><button onclick="backup()">Exportar backup</button><label>Importar backup (substitui dados)<input type="file" accept=".json,application/json" onchange="restore(this)"></label></section>`}function saveSettings(){let s={...db.settings};for(let k of ['energy','labor','overhead','margin','tax','fail'])s[k]=n(k);if(s.margin+s.tax>=100||s.fail>=100)throw Error('Percentuais inválidos.');db.settings=s;save();notify('Configurações salvas')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='3D-Cost-Pro-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());for(let k of ['printers','filaments','products','quotes','sales','expenses'])if(!Array.isArray(x[k])||x[k].some(y=>!y||typeof y.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(y.id)))throw Error('Backup inválido.');if(!x.settings||typeof x.settings!=='object')throw Error('Configurações inválidas.');if(confirm('Substituir todos os dados atuais?')){db=x;save();render();notify('Backup restaurado')}}catch(e){alert(e.message)}}const cloudKey='3dcost-cloud-v3';let cloud={client:'',auto:false,last:0,dirty:true};try{Object.assign(cloud,JSON.parse(localStorage.getItem(cloudKey)||'{}'))}catch(e){}let token='',expires=0,busy=false;function cloudSave(){localStorage.setItem(cloudKey,JSON.stringify(cloud))}function cloudStatus(s){if($('cloudStatus'))$('cloudStatus').textContent=s}function cloudPanel(){return `<section><h2>Google Drive</h2><p>Backup privado na pasta 3D Cost Pro / Backups. Não é sincronização em tempo real.</p><label>ID do cliente OAuth Google<input id="oauthClient" value="${esc(cloud.client)}" placeholder="...apps.googleusercontent.com"></label><div class="actions"><button onclick="cloudConfig()">Salvar configuração</button><button onclick="cloudConnect()">Conectar Google</button><button class="secondary" onclick="cloudDisconnect()">Desconectar</button></div><label><input style="width:auto;display:inline" type="checkbox" ${cloud.auto?'checked':''} onchange="cloud.auto=this.checked;cloudSave()"> Backup automático a cada 24 horas, se houver alterações</label><div class="actions"><button onclick="cloudTask(uploadCloud)">Fazer backup agora</button><button onclick="cloudTask(listCloud)">Listar backups / restaurar</button></div><p id="cloudStatus">${token?'Conectado nesta sessão':'Não conectado'} · Último backup: ${cloud.last?new Date(cloud.last).toLocaleString('pt-BR'):'nenhum'}</p><div id="cloudList"></div><p class="muted">Requer hospedagem HTTPS, ID OAuth próprio e autorização Google. Quando a sessão expirar, reconecte. O backup automático só funciona com o aplicativo aberto.</p></section>`}function cloudConfig(){cloud.client=$('oauthClient').value.trim();cloudSave();cloudDisconnect();cloudStatus('Configuração salva. Conecte sua conta.')}function cloudDisconnect(){if(token&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(token,()=>{});token='';expires=0;cloudStatus('Desconectado')}async function cloudConnect(){if(location.protocol==='file:'){cloudStatus('Para conectar ao Google Drive, hospede o aplicativo em HTTPS. O backup local continua disponível.');return}if(!window.google?.accounts?.oauth2){try{await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.onload=resolve;script.onerror=reject;document.head.appendChild(script)})}catch(e){cloudStatus('Não foi possível carregar o Google. Confira a internet.');return}}if(!cloud.client||!window.google?.accounts?.oauth2){cloudStatus('Configure o ID OAuth e verifique a conexão à internet.');return}if(location.protocol==='file:'){cloudStatus('Abra a versão hospedada em HTTPS, não o arquivo local.');return}try{google.accounts.oauth2.initTokenClient({client_id:cloud.client,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.error){cloudStatus(r.error);return}token=r.access_token;expires=Date.now()+Number(r.expires_in)*1000;cloudStatus('Google conectado.');},error_callback:e=>cloudStatus(e.type||'Falha de autorização')}).requestAccessToken({prompt:'select_account'})}catch(e){cloudStatus(e.message)}}async function api(path,opts={}){if(!token||Date.now()>expires-30000)throw Error('Reconecte sua conta Google.');let r=await fetch('https://www.googleapis.com/'+path,{...opts,headers:{...opts.headers,Authorization:'Bearer '+token}});if(!r.ok)throw Error('Google Drive: '+r.status);return r.status===204?null:r.json()}async function files(q){let all=[],p='';do{let x=await api('drive/v3/files?'+new URLSearchParams({q:'trashed = false and ('+q+')',fields:'nextPageToken,files(id,name,createdTime)',pageSize:'100',...(p?{pageToken:p}:{})}));all.push(...x.files);p=x.nextPageToken}while(p);return all}async function folder(name,parent){let q=`mimeType = 'application/vnd.google-apps.folder' and name = '${name}' and '${parent}' in parents`;let a=await files(q);if(a.length)return a[0].id;return (await api('drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parent]})})).id}async function backupFolder(){return folder('Backups',await folder('3D Cost Pro','root'))}async function cloudTask(fn){if(busy)return;busy=true;try{await fn()}catch(e){cloudStatus(e.message)}finally{busy=false}}async function uploadCloud(){let snapshot=JSON.stringify(db),parent=await backupFolder(),name='3D-Cost-Pro-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',form=new FormData();form.append('metadata',new Blob([JSON.stringify({name,parents:[parent]})],{type:'application/json'}));form.append('file',new Blob([snapshot],{type:'application/json'}));await api('upload/drive/v3/files?uploadType=multipart',{method:'POST',body:form});cloud.last=Date.now();cloud.dirty=JSON.stringify(db)!==snapshot;cloudSave();cloudStatus('Backup salvo no Google Drive.');let a=await files(`'${parent}' in parents and name contains '3D-Cost-Pro-'`);a=a.filter(x=>/^3D-Cost-Pro-.*\.json$/.test(x.name)).sort((a,b)=>b.createdTime.localeCompare(a.createdTime));for(let x of a.slice(10))await api('drive/v3/files/'+encodeURIComponent(x.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:'{"trashed":true}'});}async function listCloud(){let parent=await backupFolder(),a=await files(`'${parent}' in parents and name contains '3D-Cost-Pro-'`);let box=$('cloudList');if(!box)return;box.replaceChildren();for(let x of a.sort((a,b)=>b.createdTime.localeCompare(a.createdTime))){let b=document.createElement('button');b.textContent='Restaurar '+new Date(x.createdTime).toLocaleString('pt-BR');b.style.margin='5px';b.onclick=()=>cloudTask(async()=>{let data=await api('drive/v3/files/'+encodeURIComponent(x.id)+'?alt=media');validateCloud(data);if(confirm('Substituir os dados locais pelo backup? Exporte uma cópia local antes.')){db=data;save();render();cloudStatus('Backup restaurado.')}});box.append(b)}cloudStatus(a.length+' backup(s) encontrado(s).')}function validateCloud(x){for(let k of ['printers','filaments','products','quotes','sales','expenses'])if(!Array.isArray(x[k])||x[k].some(y=>!y||typeof y.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(y.id)))throw Error('Backup inválido');if(!x.settings||typeof x.settings!=='object')throw Error('Configurações inválidas')}setInterval(()=>{if(cloud.auto&&cloud.dirty&&Date.now()-cloud.last>=86400000&&token&&Date.now()<expires-30000&&navigator.onLine)cloudTask(uploadCloud)},60000);

try{render()}catch(e){$('main').textContent='Erro ao abrir: '+e.message+'. Preserve seus backups e tente outro navegador.';}
